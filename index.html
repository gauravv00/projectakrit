<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D5C63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Akrit - Digital E-Waste Supply Chain & Digital Manifest Layer for India's Informal Recycling Sector">
<title>Akrit — Digital E-Waste Supply Chain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout concept: one shared component set, three role themes.
   Kabadiwala and shop owner get a single 480px column with a bottom bar; the compliance officer gets a wide, data-dense workspace.
   Deep teal carries structure, amber marks the one action that matters on each screen. */
:root{
  --bg:#F9F7F4; --surface:#FFFFFF; --surface2:#F1EEE8; --line:#E0DACF; --text:#1B2829; --muted:#566466;
  --primary:#0D5C63; --on-primary:#FFFFFF; --primary-ink:#0D5C63; --primary-soft:#DCEDEE;
  --amber:#F4A261; --on-amber:#2E1B00; --amber-ink:#8A4B00; --amber-soft:#FCEBD8; --amber-strong:#C97420;
  --ok:#17653D; --ok-soft:#DDF1E5; --ok-strong:#1E8450; --bad:#B3261E; --bad-soft:#FBE3E0;
  --sea:#D9E9EA; --land:#F1EEE8; --banner-bg:#2B3638; --banner-fg:#F1F5F4;
  --paper:#FFFDF8; --paper-ink:#1B2829; --paper-muted:#5A6668; --paper-line:#D8D1C3;
  --shadow:0 1px 2px rgba(13,40,43,.06),0 6px 18px rgba(13,40,43,.07);
  --font-head:'Nunito','Noto Sans Devanagari',system-ui,sans-serif;
  --font-body:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1819; --surface:#152426; --surface2:#1B2F32; --line:#2A4144; --text:#E7EFEE; --muted:#9DB1B3;
  --primary-ink:#7AD0D7; --primary-soft:#12383C; --amber-ink:#F4B07A; --amber-soft:#3A2A15; --amber-strong:#F4A261;
  --ok:#72D9A3; --ok-soft:#123524; --ok-strong:#4CC287; --bad:#FF9B92; --bad-soft:#3D1B19;
  --sea:#102A2D; --land:#152426; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1819; --surface:#152426; --surface2:#1B2F32; --line:#2A4144; --text:#E7EFEE; --muted:#9DB1B3;
  --primary-ink:#7AD0D7; --primary-soft:#12383C; --amber-ink:#F4B07A; --amber-soft:#3A2A15; --amber-strong:#F4A261;
  --ok:#72D9A3; --ok-soft:#123524; --ok-strong:#4CC287; --bad:#FF9B92; --bad-soft:#3D1B19;
  --sea:#102A2D; --land:#152426; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-ink)}
:focus-visible{outline:3px solid var(--amber-strong);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{width:100%;max-width:480px;margin:0 auto}
.col.wide{max-width:1240px}
.col.mid{max-width:760px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
svg.i{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}

/* demo bar & modern header */
.demobar{background:rgba(241,238,232,.95);border-bottom:1px solid var(--line);font-size:.82rem;position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.demobar .col{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:50px}
.demobar .col.wide,.demobar .col{max-width:1240px}
.demobar button{background:var(--surface);border:1px solid var(--line);min-height:36px;padding:4px 12px;border-radius:99px;color:var(--text);font-weight:600;font-size:.78rem;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.demobar button:hover{border-color:var(--primary-ink);color:var(--primary-ink);transform:translateY(-1px)}
.demobar button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.demobar .role-select{font-size:.8rem;height:36px;border-radius:99px;padding:0 12px;border:1.5px solid var(--primary-ink);background:var(--surface);font-weight:700;color:var(--primary-ink);outline:none;cursor:pointer}
.demobar .tag{color:var(--muted);font-weight:600}
.dotlive{width:9px;height:9px;border-radius:50%;background:var(--ok-strong);display:inline-block;box-shadow:0 0 0 0 rgba(23,101,61,.7);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(23,101,61,.7)}70%{box-shadow:0 0 0 7px rgba(23,101,61,0)}100%{box-shadow:0 0 0 0 rgba(23,101,61,0)}}
.dotlive.off{background:var(--amber-strong);animation:none;box-shadow:none}

/* industrial digital scale console */
.scale-console{background:#0e1718;color:#2ce88d;border-radius:20px;border:2px solid #1a3236;padding:20px;box-shadow:inset 0 4px 12px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.25);text-align:center;position:relative}
.scale-console .brand{font:700 .75rem var(--font-mono);letter-spacing:.14em;color:#5a8a8e;text-transform:uppercase;margin-bottom:8px}
.scale-console .readout{font:800 3.6rem/1 var(--font-mono);color:#3bf59c;letter-spacing:.02em;text-shadow:0 0 16px rgba(59,245,156,.35);font-variant-numeric:tabular-nums}
.scale-console .unit{font-size:1.1rem;color:#7ad0d7;margin-left:6px;font-weight:700}
.scale-console .tolerance-pill{margin-top:10px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-size:.82rem;font-weight:700}
.scale-console .tolerance-pill.ok{background:rgba(23,101,61,.3);color:#4cd98d;border:1px solid #1e8450}
.scale-console .tolerance-pill.warn{background:rgba(244,162,97,.2);color:#f4b07a;border:1px solid #c97420}
.scale-console .tolerance-pill.bad{background:rgba(179,38,30,.25);color:#ff9b92;border:1px solid #b3261e}

/* app bars */
.appbar{background:var(--primary);color:var(--on-primary)}
.appbar .col{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding-block:8px}
.appbar .sub{font-size:.8rem;opacity:.85}
.appbar h1{font-size:1.25rem;font-weight:800}
.brandmark{display:inline-flex;align-items:center;gap:10px;font:800 1.4rem var(--font-head)}
.lang{display:inline-flex;background:rgba(255,255,255,.14);border-radius:12px;padding:2px}
.lang button{min-width:48px;min-height:44px;border:0;background:none;color:inherit;border-radius:10px;font-weight:700;font-size:.95rem}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--primary-ink)}
.lang.dark{background:var(--surface2)}
.lang.dark button{color:var(--text)}
.offline{background:var(--banner-bg);color:var(--banner-fg);font-size:.82rem}
.offline .col{display:flex;align-items:center;gap:8px;min-height:36px}
.page{padding-block:16px 150px}
.page.pc{padding-block:20px 120px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow)}
.card h3{font-size:1.05rem}
.h1{font-size:1.5rem;font-weight:800}
.h2{font-size:1.15rem;font-weight:800}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:1rem;text-decoration:none;text-align:center}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-amber{background:var(--amber);color:var(--on-amber)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-outline{background:transparent;border-color:var(--primary-ink);color:var(--primary-ink)}
.btn-wa{background:#1F8F4A;color:#fff}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 14px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary-ink);font-weight:700;text-decoration:underline;min-height:48px;padding:0 8px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap;line-height:1.4}
.chip svg.i{width:1em;height:1em;stroke-width:2.6}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--amber-soft);color:var(--amber-ink)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--primary-soft);color:var(--primary-ink)}
.chip.mute{background:var(--surface2);color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-weight:600;font-size:.9rem}
.field .hint{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:1rem}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary-ink);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.err{color:var(--bad);font-size:.88rem;font-weight:600;min-height:1.3em}
.otp{letter-spacing:.5em;text-align:center;font:700 1.6rem var(--font-mono)}
.photo-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border:2px dashed var(--primary-ink);border-radius:16px;background:var(--surface);color:var(--primary-ink);font-weight:700;text-align:center;padding:16px;position:relative;cursor:pointer}
.photo-btn:focus-within{outline:3px solid var(--amber-strong);outline-offset:2px}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-btn img{max-height:200px;border-radius:12px}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.prog.amber>i{background:var(--amber-strong)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:48px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{border-color:var(--primary-ink);background:var(--primary-soft);color:var(--primary-ink)}
input[type=range]{width:100%;min-height:48px;accent-color:var(--primary)}
.check{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.switch button{position:relative;width:56px;height:32px;border-radius:99px;border:0;background:var(--line);flex:none}
.switch button::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch button[aria-checked="true"]{background:var(--primary)}
.switch button[aria-checked="true"]::after{transform:translateX(24px)}

/* role select */
.rolecard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);min-height:104px;position:relative}
.rolecard:hover,.rolecard:focus-visible{border-color:var(--primary-ink)}
.rolecard .ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary-ink)}
.rolecard .ico svg{width:34px;height:34px}
.rolecard.s .ico{background:var(--amber-soft);color:var(--amber-ink)}
.rolecard.c .ico{background:var(--surface2);color:var(--text)}
.rolecard b{font:800 1.2rem var(--font-head);display:block}
.rolecard span.d{color:var(--muted);font-size:.95rem}
.rolecard .cont{position:absolute;right:14px;top:12px}

/* kabadiwala */
.cta-big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:max(220px,36vh);border:0;border-radius:22px;background:var(--amber);color:var(--on-amber);text-align:center;padding:24px 16px;box-shadow:0 8px 0 var(--amber-strong)}
.cta-big:active{transform:translateY(4px);box-shadow:0 4px 0 var(--amber-strong)}
.cta-big svg{width:56px;height:56px;stroke-width:1.8}
.cta-big b{font:800 1.7rem/1.15 var(--font-head)}
.cta-big span{font-weight:600;opacity:.85}
.stats{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.stat .v{font:800 2rem/1.1 var(--font-head);font-variant-numeric:tabular-nums}
.stat.big .v{font-size:2.5rem}
.stat .l{color:var(--muted);font-size:.85rem;margin-top:2px}
.motiv .track{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:10px 0 6px}
.motiv .a{background:var(--muted);opacity:.55}
.motiv .b{background:var(--primary);transition:width .6s}
.motiv .legend{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.motiv .extra{font:800 1.25rem var(--font-head);color:var(--ok)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:128px;padding:12px 4px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.cat svg{width:46px;height:46px;stroke:var(--primary-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cat b{font:800 1.25rem var(--font-head)}
.cat small{color:var(--muted);font-size:.72rem}
.cat[aria-pressed="true"]{border-color:var(--primary-ink);background:var(--primary-soft)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper button{width:84px;height:84px;border-radius:50%;border:2px solid var(--primary-ink);background:var(--surface);color:var(--primary-ink);display:grid;place-items:center;touch-action:manipulation}
.stepper button svg{width:36px;height:36px}
.stepper button:active{background:var(--primary-soft)}
.stepper output{display:block;text-align:center;font:800 3.2rem/1 var(--font-head);font-variant-numeric:tabular-nums}
.stepper small{display:block;text-align:center;color:var(--muted);font-weight:600}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--primary)}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface2);flex:none;display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:26px;height:26px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:76px}
.item .t{font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px));z-index:20}
.nav .col{display:flex}
.nav button{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);font-weight:700;font-size:.8rem}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--primary-ink)}
.nav button[aria-current="page"] svg{stroke-width:2.6}
.fabwrap{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fabwrap .col{display:flex;justify-content:flex-end}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 18px;border-radius:99px;border:0;background:var(--primary);color:var(--on-primary);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.overlay .top .col{display:flex;align-items:center;gap:8px;min-height:60px;padding-top:env(safe-area-inset-top,0px)}
.overlay .top h2{font-size:1.1rem;flex:1}
.overlay.dim{background:rgba(8,20,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.modal{background:var(--surface);width:100%;max-width:620px;border-radius:20px;padding:22px;margin:auto;max-height:92vh;overflow:auto;border:1px solid var(--line)}
.overlay.dim.center{align-items:center;padding:16px}
.success{text-align:center;padding-block:20px 40px}
.coins{position:relative;width:130px;height:112px;margin:0 auto 12px}
.coin{position:absolute;left:50%;width:92px;height:28px;margin-left:-46px;border-radius:50%;background:linear-gradient(#F8CB8A,#E39A3E);border:2px solid #B9741F;box-shadow:0 4px 0 #B9741F;display:grid;place-items:center;font:800 .8rem var(--font-head);color:#6B3F0B;animation:coin .75s cubic-bezier(.3,.9,.4,1) both}
.coin:nth-child(1){bottom:0;animation-delay:.05s}.coin:nth-child(2){bottom:15px;animation-delay:.3s}.coin:nth-child(3){bottom:30px;animation-delay:.55s}.coin:nth-child(4){bottom:45px;animation-delay:.8s}.coin:nth-child(5){bottom:60px;animation-delay:1.05s}
@keyframes coin{0%{transform:translateY(-240px);opacity:0}12%{opacity:1}68%{transform:translateY(0)}82%{transform:translateY(-9px)}100%{transform:translateY(0)}}
.codecard{display:block;width:100%;background:var(--surface);border:2px solid var(--primary);border-radius:18px;padding:18px;text-align:center;view-transition-name:mf-card}
.codecard .code{font:700 1.55rem/1.2 var(--font-mono);color:var(--primary-ink);letter-spacing:.04em;word-break:break-all}

/* toast */
#toasts{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:max(12px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--primary);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);animation:tin .3s ease both;font-size:.95rem}
.toast .app{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:2px}
@keyframes tin{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}

/* skeleton */
.sk{border-radius:10px;background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:skm 1.3s linear infinite}
@keyframes skm{to{background-position:-200% 0}}

/* manifest document */
.mdoc{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;view-transition-name:mf-card;border:1px solid var(--paper-line)}
.mdoc::before{content:'';position:absolute;inset:8px;border:1.5px solid var(--primary);border-radius:3px;pointer-events:none;z-index:3;opacity:.75}
.mdoc .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0;overflow:hidden}
.mdoc .wm span{font:800 5.4rem var(--font-head);letter-spacing:.12em;color:var(--primary);opacity:.06;transform:rotate(-28deg);white-space:nowrap}
.mdoc .hd{position:relative;z-index:1;background:var(--primary);color:#fff;padding:26px 24px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mdoc .hd b{font:800 1.25rem var(--font-head);display:block}
.mdoc .hd small{opacity:.85;letter-spacing:.14em;font-size:.68rem;font-weight:600;text-transform:uppercase}
.mdoc .body{position:relative;z-index:1;padding:20px 24px 26px}
.mdoc .idrow{display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1.5px dashed var(--paper-line);padding-bottom:16px;margin-bottom:14px}
.mdoc .mid{font:700 1.5rem/1.15 var(--font-mono);letter-spacing:.02em;word-break:break-all;color:var(--primary)}
.mdoc .qr{background:#fff;padding:6px;border:1px solid var(--paper-line);border-radius:6px;flex:none;line-height:0}
.mdoc .qr svg{width:96px;height:96px;fill:#14201F}
.mdoc dl{margin:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:8px 14px}
.mdoc dt{color:var(--paper-muted);font-size:.8rem}
.mdoc dd{margin:0;font-weight:600;font-size:.92rem;text-align:right;overflow-wrap:anywhere}
.mdoc .wt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:rgba(13,92,99,.07);border-radius:8px;padding:12px;margin:14px 0}
.mdoc .wt b{font:800 1.5rem var(--font-head);display:block;font-variant-numeric:tabular-nums}
.mdoc .wt small{color:var(--paper-muted);font-size:.74rem}
.mdoc .wt .mid2{text-align:center;font-size:.78rem;font-weight:700}
.mdoc .map{border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;margin:14px 0;background:#E7F0F0;line-height:0}
.mdoc .stamp{display:flex;align-items:center;gap:10px;justify-content:center;border:2px solid;border-radius:10px;padding:10px;font:800 1.05rem var(--font-head);letter-spacing:.02em;transform:rotate(-1.2deg)}
.mdoc .stamp.ok{border-color:#17653D;color:#17653D;background:#E4F4EA}
.mdoc .stamp.warn{border-color:#8A4B00;color:#8A4B00;background:#FBEBD6}
.mdoc .stamp.bad{border-color:#B3261E;color:#B3261E;background:#FBE5E2}
.mdoc .foot{font-size:.72rem;color:var(--paper-muted);margin-top:12px;text-align:center}
.mdoc .photo{width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--paper-line);margin-top:12px}

/* shop */
.gbadge{position:relative;width:88px;height:96px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 16%,100% 62%,50% 100%,0 62%,0 16%);background:var(--surface2);color:var(--muted);overflow:hidden}
.gbadge svg{width:40px;height:40px;position:relative;z-index:1}
.gbadge.on{background:linear-gradient(135deg,#F8DA94,#E0A12F 55%,#B97A14);color:#2E1B00}
.gbadge::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);transform:translateX(-130%);z-index:2}
.gbadge.unlock{background:linear-gradient(135deg,#F8DA94,#E0A12F 55%,#B97A14);color:#2E1B00;animation:togold 1.6s ease both}
.gbadge.unlock::after{animation:sheen 1.4s .25s ease both}
@keyframes sheen{to{transform:translateX(130%)}}
@keyframes togold{0%{filter:grayscale(1) brightness(1.15)}60%{filter:grayscale(.6) brightness(1.1)}100%{filter:none}}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vlist li{display:flex;gap:12px;align-items:flex-start}
.vlist .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:var(--muted)}
.vlist .dot svg{width:15px;height:15px;stroke-width:3}
.vlist li.done .dot{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rates div{background:var(--surface2);border-radius:10px;padding:8px;text-align:center;font-size:.8rem}
.rates b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .full{grid-column:1/-1}

/* compliance */
.pnav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.pnav .col{display:flex;align-items:center;gap:4px}
.pnav .tabs{display:flex;gap:2px;overflow-x:auto;flex:1}
.pnav .tabs button{min-height:52px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:var(--muted);white-space:nowrap}
.pnav .tabs button[aria-current="page"]{color:var(--primary-ink);border-color:var(--primary-ink)}
.pnav .who{font-size:.85rem;color:var(--muted);text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi .v{font:800 2.1rem/1.1 var(--font-head);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .s{color:var(--muted);font-size:.85rem;margin-top:4px}
.dialbox{display:flex;align-items:center;gap:14px}
.dial{width:118px;height:118px;flex:none}
.dial .trk{stroke:var(--line);fill:none;stroke-width:12}
.dial .arc{stroke:var(--amber-strong);fill:none;stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px}
.dial.ok .arc{stroke:var(--ok-strong)}
.dial text{font:800 26px var(--font-head);fill:var(--text)}
.dial.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.mapbox{border-radius:12px;overflow:hidden;border:1px solid var(--line);line-height:0;background:var(--land)}
.mapbox svg{width:100%;height:auto;max-height:560px}
.zrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.zrow:last-child{border:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:860px;font-size:.88rem}
.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0;white-space:nowrap}
.tbl th button{width:100%;min-height:44px;padding:0 12px;border:0;background:none;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:700;display:flex;align-items:center;gap:4px;text-align:left}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:var(--surface2)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .xp{width:44px;padding:0 0 0 6px}
.tbl .xp button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.tbl tr.open .xp svg{transform:rotate(180deg)}
.tbl tr.detail td{background:var(--surface2);padding:16px}
.dgrid{display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.dgrid img{width:140px;height:110px;object-fit:cover;border-radius:10px;background:var(--line)}
.dgrid dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem}
.dgrid dt{color:var(--muted)}
.dgrid dd{margin:0;font-weight:600}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px);display:none}
.pbar .col{display:flex}
.pbar button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);font-weight:700;font-size:.72rem}
.pbar button svg{width:22px;height:22px}
.pbar button[aria-current="page"]{color:var(--primary-ink)}
.empty{text-align:center;padding:28px 16px}
.empty h3{margin:10px 0 6px}
.cta-banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--primary);color:var(--on-primary);border-radius:18px;padding:20px 22px}
.cta-banner h2{font-size:1.25rem}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:.7rem;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--primary);border-radius:6px 6px 0 0;min-height:3px}
.bars b{font-size:.7rem;color:var(--text);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.toolbar{display:grid;grid-template-columns:minmax(200px,2fr) repeat(3,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.toolbar input,.toolbar select{min-height:48px}

@media (max-width:900px){
  .pnav .tabs{display:none}.pbar{display:block}.pnav .who{display:none}
  .maprow{grid-template-columns:1fr}
  .toolbar{grid-template-columns:1fr 1fr}.toolbar .full{grid-column:1/-1}
  .dgrid{grid-template-columns:1fr}.dgrid img{width:100%;height:160px}
  .page.pc{padding-bottom:100px}
}
@media (max-width:420px){
  .stats{grid-template-columns:1fr}
  .lang button{min-width:44px}
  .mdoc .idrow{flex-direction:column;align-items:flex-start}
  .mdoc .wm span{font-size:3.6rem}
}
::view-transition-group(mf-card){animation-duration:.4s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.sk{animation:none}}

let syncing=false;
const API_URL = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : 'http://localhost:3000';

async function trySync(){
 if(syncing||isOffline()||!S.queue.length)return;
 syncing=true;let n=0;
 try{
  for(const q of [...S.queue]){
   const rec=(q.k==='m'?S.local.m:S.local.p)[q.id];
   if(!rec)continue;
   if(S.db){
    await S.db.doc((q.k==='m'?'manifests/':'pickups/')+q.id).set(rec);
   } else {
    const ep = q.k==='m' ? '/api/manifests' : '/api/pickups';
    const isUpdate = q.k==='m' && rec.status !== 'pending';
    let url = API_URL + ep;
    let method = 'POST';
    if(isUpdate){
      url = API_URL + '/api/manifests/' + encodeURIComponent(rec.id) + '/verify';
      method = 'PATCH';
    }
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rec)
    });
    if(!res.ok) throw new Error('API sync failed: ' + res.status);
   }
   S.queue=S.queue.filter(x=>!(x.k===q.k&&x.id===q.id));
   n++;
  }
  S.dbState='live';
  persist();
  if(S.ui.wasOffline&&n){
    S.ui.wasOffline=false;
    const p=prof();
    if(p&&p.role==='kabadi')push(S.lang==='en'?`Back online. ${n} handover${n>1?'s are':' is'} now registered.`:'नेटवर्क वापस आ गया। आपके हैंडओवर दर्ज हो गए।');
  }
 } catch(e){
  if(!isOffline()) S.dbState='local';
 } finally {
  syncing=false;
  softRender();
 }
}

async function initDb(){
 setTimeout(()=>{if(S.loading){S.loading=false;softRender()}},1200);
 try {
  const manifestsRes = await fetch(API_URL + '/api/manifests');
  if(manifestsRes.ok) {
   const data = await manifestsRes.json();
   if(data.manifests && Array.isArray(data.manifests)) {
    const o = {};
    data.manifests.forEach(m => { o[m.id] = m; });
    S.remote.m = o;
   }
   try {
     const pickupsRes = await fetch(API_URL + '/api/pickups');
     if(pickupsRes.ok) {
       const pData = await pickupsRes.json();
       if(pData.pickups && Array.isArray(pData.pickups)) {
         const op = {};
         pData.pickups.forEach(p => { op[p.id] = p; });
         S.remote.p = op;
       }
     }
   } catch(pe) {}

   S.dbState = 'live';
   S.loading = false;
   bump();
   checkNotifs();
   softRender();
   trySync();

   if(typeof EventSource !== 'undefined') {
    try {
      const evtSource = new EventSource(API_URL + '/api/events');
      evtSource.onmessage = e => {
        try {
          const payload = JSON.parse(e.data);
          if(payload.type === 'insert' || payload.type === 'update') {
            if(payload.collection === 'manifests' && payload.item) {
              S.remote.m[payload.item.id] = payload.item;
              bump();
              checkNotifs();
              softRender();
            } else if(payload.collection === 'pickups' && payload.item) {
              S.remote.p[payload.item.id] = payload.item;
              bump();
              softRender();
            }
          }
        } catch(err) {}
      };
    } catch(se) {}
   }
   return;
  }
 } catch(apiErr) {}

 try{
  const cl=window.claude;if(!cl||!cl.use){S.dbState='local';return}
  const db=await cl.use('db');if(!db){S.dbState='local';softRender();return}
  S.db=db;S.dbState='live';
  const got=()=>{S.loading=false;bump();checkNotifs();softRender();trySync()};
  const bad=e=>{S.dbState='error';S.loading=false;softRender()};
  db.collection('manifests').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.remote.m=o;got()},bad);
  db.collection('pickups').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.remote.p=o;got()},bad);
 }catch(e){S.dbState='local'}
}

function obNext(){
 const o=S.ob,d=o.d,id=OB[o.role][o.step],err=m=>{const e=$('#err');if(e)e.textContent=m;return false};
 if(id==='phone'&&!/^[6-9]\d{9}$/.test(d.phone||''))return err('Enter a valid 10-digit mobile number.');
 if((id==='otp'||id==='verify')&&(d.otp||'')!=='123456')return err('That code is not right. Try 123456 in this demo.');
 if(id==='photo'&&!d.photo)return err('Take a photo of your face to continue.');
 if(id==='shop'){if(!(d.shopName||'').trim())return err('Enter your shop name.');if(!d.photo)return err('Add a photo of the shop signboard.');
  if(d.gst&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(d.gst.toUpperCase()))return err('That GST number does not look right. Leave it empty to add it later.')}
 if(id==='email'){if(!(d.name||'').trim())return err('Enter your name.');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email||''))return err('Enter a valid email address.');if(FREE_MAIL.test(d.email))return err('Use your company email. Personal addresses are not accepted.')}
 if(id==='company'){if(!(d.company||'').trim())return err('Enter the company name.');const v=(d.idNo||'').toUpperCase().trim();
  if(!(/^[LU]\d{5}[A-Z]{2}\d{4}[A-Z]{3}\d{6}$/.test(v)||/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(v)))return err('Enter a valid 21-character CIN or 15-character GSTIN.');d.idNo=v}
 if(o.step<OB[o.role].length-1){o.step++;render();return}
 const base={id:'u'+rid4()+rid4(),createdAt:Date.now()};let p;
 if(o.role==='kabadi')p={...base,role:'kabadi',phone:d.phone,name:(d.name||'').trim(),photo:d.photo,zone:d.zone||'Dharavi',aadhaarLast4:null,named:false};

 else p={...base,role:'compliance',email:d.email,name:d.name.trim(),company:d.company.trim(),idType:d.idNo.length===21?'CIN':'GSTIN',idNo:d.idNo,connected:[],target:1200,kgPerCredit:1,anonymize:false,includeSample:true};
 S.profiles[o.role]=p;S.role=o.role;S.view='app';S.ob=null;S.tab[o.role]=o.role==='compliance'?'overview':'home';persist();render();window.scrollTo(0,0)}

function cdata(){
 const p=prof(),Q=quarterOf(Date.now()),all=getAll().filter(m=>p.connected.includes(m.rid));
 const qm=all.filter(m=>m.pickupAt>=Q.start&&m.pickupAt<=Q.end),ver=qm.filter(m=>m.status==='verified'),kg=sum(ver,m=>m.wv);
 const gens=new Map();qm.forEach(m=>gens.set(m.gid,m.role));
 return{Q,all,qm,ver,kg,credits:Math.floor(kg/p.kgPerCredit),pct:kg/p.target*100,src:gens.size,kab:[...gens.values()].filter(r=>r==='kabadi').length,shops:[...gens.values()].filter(r=>r==='shop').length}}

function viewCompliance(){
 const p=prof(),tab=S.tab.compliance;
 const tabs=[['overview',t('ov'),'chart'],['manifests',t('mf'),'doc'],['recyclers',t('rc'),'truck'],['reports',t('rp'),'pdf'],['settings',t('st'),'settings']];

 ${p.connected.length?'':`<div class="cta-banner" style="margin-bottom:16px"><div><h2>${t('connect')}</h2><p style="opacity:.92;margin-top:4px;max-width:52ch">Connect the recyclers you work with. Their verified handovers appear on this dashboard as soon as they are confirmed.</p></div><button type="button" class="btn btn-amber" data-act="tab" data-v="recyclers">${ic('truck')}Connect recyclers</button></div>`}

function mapBlock(D){
 const W=420,H=640,LAT0=19.42,LAT1=18.90,LNG0=72.76,LNG1=73.08,px=g=>(g-LNG0)/(LNG1-LNG0)*W,py=a=>(LAT0-a)/(LAT0-LAT1)*H;
 const coast=[[19.43,72.742],[19.39,72.80],[19.33,72.815],[19.27,72.82],[19.2,72.815],[19.13,72.808],[19.07,72.815],[19.02,72.805],[18.98,72.80],[18.93,72.805],[18.89,72.815]];
 const sea='M0,0L'+coast.map(c=>px(c[1]).toFixed(1)+','+py(c[0]).toFixed(1)).join('L')+`L0,${H}Z`;
 const z={};D.ver.forEach(m=>{(z[m.zone]=z[m.zone]||{kg:0,n:0}).kg+=m.wv;z[m.zone].n++});
 const zs=Object.entries(z).sort((a,b)=>b[1].kg-a[1].kg),mx=Math.max(1,...zs.map(x=>x[1].kg));
 const heat=zs.map(([n,v])=>{const c=ZONES[n];return`<circle cx="${px(c[1]).toFixed(1)}" cy="${py(c[0]).toFixed(1)}" r="${(28+Math.sqrt(v.kg/mx)*58).toFixed(0)}" fill="url(#heat)"/>`}).join('');
 const dots=D.ver.map(m=>`<circle cx="${px(m.lng).toFixed(1)}" cy="${py(m.lat).toFixed(1)}" r="2.8" fill="var(--primary)" stroke="var(--surface)" stroke-width="1"/>`).join('');
 const lab=zs.map(([n,v])=>{const c=ZONES[n],x=px(c[1]),y=py(c[0]);return`<g><title>${n}: ${nf(v.kg)} kg in ${v.n} handovers</title><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Inter,sans-serif">${v.n}</text><text x="${(x+19).toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="12" font-weight="600" fill="var(--text)" font-family="Inter,sans-serif" paint-order="stroke" stroke="var(--land)" stroke-width="3">${n}</text></g>`}).join('');
 const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of verified handovers by zone. ${zs.map(([n,v])=>n+' '+nf(v.kg)+' kilograms').join('; ')||'No verified handovers yet'}"><defs><radialGradient id="heat"><stop offset="0%" stop-color="var(--amber-strong)" stop-opacity=".75"/><stop offset="55%" stop-color="var(--amber)" stop-opacity=".32"/><stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/></radialGradient></defs>
  <rect width="${W}" height="${H}" fill="var(--land)"/>${[1,2,3,4,5].map(i=>`<path d="M0 ${i*H/6}H${W}M${i*W/6} 0V${H}" stroke="var(--line)" stroke-width=".6" opacity=".6"/>`).join('')}<path d="${sea}" fill="var(--sea)"/><text x="16" y="${H/2}" font-size="13" font-style="italic" fill="var(--muted)" font-family="Inter,sans-serif" transform="rotate(-90 16 ${H/2})" text-anchor="middle">Arabian Sea</text>${heat}${dots}${lab}</svg>`;
 return`<div class="maprow"><div class="mapbox">${svg}</div><div><h3 style="margin-bottom:6px;font-size:.95rem">Verified kg by zone</h3>${zs.length?zs.map(([n,v])=>`<div class="zrow"><span><b>${n}</b></span><div class="prog" aria-hidden="true"><i style="width:${v.kg/mx*100}%"></i></div><span class="num"><b>${nf(v.kg)}</b> kg</span></div>`).join(''):`<div class="empty"><p class="muted">No verified handovers yet. Connect a recycler, then confirm a handover from the kabadiwala or shop role.</p></div>`}<p class="muted" style="font-size:.8rem;margin-top:10px">Numbers on the map show verified handovers per zone. Dots are individual handover points.</p></div></div>`}

/* manifests table */
const SORTS={id:m=>m.id,gen:m=>(m.named?m.gname:m.gcode).toLowerCase(),cat:m=>m.cat,kg:m=>m.wv??m.wl,rec:m=>REC[m.rid].name,date:m=>m.pickupAt,status:m=>({verified:0,pending:1,flagged:2})[m.status]};
const tf=()=>S.ui.tf||(S.ui.tf={q:'',status:'',cat:'',rid:'',key:'date',dir:-1,n:12,open:{}});
function tblItems(full){
 const f=tf();let r=cdata().all;
 if(full){const q=f.q.trim().toLowerCase();if(q)r=r.filter(m=>(m.id+' '+m.gname+' '+m.gcode+' '+REC[m.rid].name+' '+m.zone).toLowerCase().includes(q));if(f.status)r=r.filter(m=>m.status===f.status);if(f.cat)r=r.filter(m=>m.cat===f.cat);if(f.rid)r=r.filter(m=>m.rid===f.rid)}
 const g=SORTS[f.key]||SORTS.date;return[...r].sort((a,b)=>{const x=g(a),y=g(b);return(x<y?-1:x>y?1:0)*f.dir})}

 const body=rows.map(m=>{const o=!!f.open[m.id];return`<tr class="r ${o?'open':''}" data-act="row" data-id="${m.id}"><td class="mono" style="font-size:.82rem;white-space:nowrap">${m.id}${m.demo?' <span class="chip mute">Sample</span>':''}</td><td>${genLabel(m)}</td><td>${CAT[m.cat].en}</td><td class="n">${m.wv!=null?nf(m.wv):`<span class="muted" title="Logged, not yet verified">${nf(m.wl)}*</span>`}</td><td>${REC[m.rid].name}</td><td style="white-space:nowrap">${fmtD(m.pickupAt)}</td><td>${sChip(m.status)}</td><td class="xp"><button type="button" data-act="row" data-id="${m.id}" aria-expanded="${o}" aria-label="Details for ${m.id}">${ic('chev')}</button></td></tr>${o?detailRow(m):''}`}).join('');

 return`<div class="tblwrap"><table class="tbl"><caption class="sr">Recent manifests. Select a column heading to sort.</caption><thead><tr>${th('id','Manifest ID')}${th('gen','Generator')}${th('cat','Category')}${th('kg','Weight (kg)',1)}${th('rec','Recycler')}${th('date','Date')}${th('status','Status')}<th class="xp"><span class="sr">Expand</span></th></tr></thead><tbody>${body}</tbody></table>${rows.length?'':empty}</div>
 ${rows.length?`<p class="muted" style="font-size:.8rem;margin-top:8px">* Logged by the generator, not yet verified by the recycler. Showing ${rows.length} of ${all.length}.</p>`:''}${full&&all.length>rows.length?`<div style="text-align:center;margin-top:10px"><button type="button" class="btn btn-ghost" data-act="more">Show more</button></div>`:''}`}
function detailRow(m){

 return`<tr class="detail"><td colspan="8"><div class="dgrid"><div>${m.photo?`<img loading="lazy" alt="Photograph of the waste" src="${m.photo}">`:`<div style="width:140px;height:110px;border-radius:10px;background:var(--line);display:grid;place-items:center;color:var(--muted);text-align:center;font-size:.75rem;padding:8px">${cic(m.cat).replace('<svg','<svg style="width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2"')}<span>No photo in this sample record</span></div>`}</div>

 <div><dl style="margin-bottom:10px"><dt>Pickup</dt><dd>${fmtDT(m.pickupAt)}</dd><dt>Recycler confirmed</dt><dd>${m.deliveredAt?fmtDT(m.deliveredAt):'Not yet'}</dd><dt>Licence</dt><dd class="mono">${r.lic}</dd>${m.note?`<dt>Note</dt><dd>${esc(m.note)}</dd>`:''}</dl><div class="row wrap"><button type="button" class="btn btn-primary btn-sm" data-act="cpcb" data-id="${m.id}">${ic('pdf')}CPCB export</button><button type="button" class="btn btn-ghost btn-sm" data-act="open-m" data-id="${m.id}">${t('viewm')}</button></div></div></div></td></tr>`}

function rdState(){return S.ui.rd||(S.ui.rd={rid:'r1',q:'',open:null,flag:false,reason:'Weight differs',kg:0})}
function rdList(){
 const d=rdState(),q=d.q.trim().toLowerCase(),all=getAll().filter(m=>m.rid===d.rid);
 const pend=all.filter(m=>m.status==='pending'&&(!q||(m.id+' '+m.gname).toLowerCase().includes(q))).sort((a,b)=>a.pickupAt-b.pickupAt);
 const done=all.filter(m=>m.status!=='pending').sort((a,b)=>b.deliveredAt-a.deliveredAt).slice(0,4);
 const row=(m,act)=>`<button type="button" class="item" ${act?`data-act="rd-open" data-id="${m.id}"`:'disabled style="opacity:1;cursor:default"'}>${photoOrIcon(m)}<span class="grow"><span class="mono" style="font-weight:600;font-size:.85rem">${m.id}</span><br><span class="muted" style="font-size:.85rem">${CAT[m.cat].en} · ${nf(m.wl)} kg logged · ${fmtDT(m.pickupAt)}</span><br><span style="font-size:.85rem">${genLabel(m)}${m.demo?' <span class="chip mute">Sample</span>':''}</span></span>${act?`<span class="chip warn">${ic('clock')}Confirm</span>`:sChip(m.status)}</button>`;
 return`<h3 style="margin:4px 0 10px">Waiting for confirmation (${pend.length})</h3><div class="stack" style="gap:10px">${pend.length?pend.map(m=>row(m,1)).join(''):'<div class="card flat empty"><p class="muted">Nothing waiting. New handovers for this recycler appear here.</p></div>'}</div>${done.length?`<h3 style="margin:20px 0 10px">Recently confirmed</h3><div class="stack" style="gap:10px">${done.map(m=>row(m,0)).join('')}</div>`:''}`}
function viewRecycler(){
 const d=rdState(),m=d.open&&getM(d.open);
 let b;
 if(m){
  const r=REC[m.rid];
  const dl=d.kg-m.wl, pct=Math.abs(dl)/m.wl*100;
  const tolClass = pct<=10 ? 'ok' : pct<=15 ? 'warn' : 'bad';
  const tolText = pct<=10 ? '✓ Within 10% CPCB Tolerance (EPR Eligible)' : '⚠️ Exceeds 10% Limit — Discrepancy Flag Required';

  b=`<button type="button" class="btn btn-ghost btn-sm" style="margin-bottom:12px" data-act="rd-back">${ic('back')}${t('back')}</button>
  <div class="card"><div class="row" style="align-items:flex-start">${photoOrIcon(m,'thumb')}
   <div class="grow"><div class="mono" style="font-weight:700">${m.id}</div><div>${CAT[m.cat].en} · ${genLabel(m)}</div><div class="muted" style="font-size:.85rem">${m.zone} · picked up ${fmtDT(m.pickupAt)}</div></div>
  </div><hr><div class="row sp"><span class="muted">Logged by generator</span><b class="num">${nf(m.wl)} kg</b></div></div>

  <div class="card" style="margin-top:12px">
   <div class="scale-console" style="margin-bottom:16px">
    <div class="brand">⚖️ MPCB CERTIFIED INDUSTRIAL WEIGH SCALE</div>
    <div class="readout"><output id="rdkg" aria-live="polite">${nf(d.kg)}</output><span class="unit">KG</span></div>
    <div class="tolerance-pill ${tolClass}">
      ${ic(pct<=10?'check':'alert')} ${tolText} (${dl>=0?'+':''}${nf(dl)} kg, ${pct.toFixed(1)}%)
    </div>
   </div>

   <div class="row" style="justify-content:center;gap:8px;margin-bottom:14px">
    <button type="button" class="btn btn-ghost" style="min-width:54px" data-hold="-1" data-for="rd">−1 kg</button>
    <button type="button" class="btn btn-ghost" style="min-width:54px" data-hold="-0.1" data-for="rd">−0.1</button>
    <button type="button" class="btn btn-ghost" style="min-width:54px" data-hold="0.1" data-for="rd">+0.1</button>
    <button type="button" class="btn btn-ghost" style="min-width:54px" data-hold="1" data-for="rd">+1 kg</button>
   </div>

   ${d.flag?`<div class="field"><span class="lbl">Reason for flagging</span><div class="seg" role="radiogroup">${['Weight differs by >10%','Photo does not match','Wrong category','Damaged / Non-recyclable'].map(x=>`<button type="button" role="radio" aria-checked="${d.reason===x}" data-act="rd-reason" data-v="${x}">${x}</button>`).join('')}</div></div><div class="row wrap"><button type="button" class="btn btn-primary grow" style="background:var(--bad)" data-act="rd-flag-ok">${ic('x')}Flag Handover</button><button type="button" class="btn btn-ghost" data-act="rd-flag">${t('cancel')}</button></div>`
   :`<div class="row wrap"><button type="button" class="btn btn-primary grow" style="background:var(--ok-strong);min-height:54px;font-size:1.1rem" data-act="rd-ok">${ic('check')}Confirm Scale Weight & Payout</button><button type="button" class="btn btn-ghost" data-act="rd-flag">${ic('alert')}Flag Discrepancy</button></div>`}
  </div>
  <p class="muted" style="font-size:.82rem;margin-top:10px">${esc(r.name)} · ${r.lic}</p>`;
 }
 else b=`<div class="field"><label for="rd-r">Active Recycling Facility</label><select id="rd-r" data-bind="ui.rd.rid">${Object.values(REC).map(r=>`<option value="${r.id}" ${d.rid===r.id?'selected':''}>${r.name} (${r.base})</option>`).join('')}</select></div><div class="field"><label for="rd-q">Scan or Search Handover Manifest</label><input id="rd-q" type="search" placeholder="Search AKR-XXXX or Generator..." data-bind="ui.rd.q" value="${esc(d.q)}"></div><div id="rdlist">${rdList()}</div>`;

 return`<header class="appbar"><div class="gut"><div class="col"><div><div class="sub">Recycler Facility Desk</div><h1>Confirm Handovers & Scale Weighing</h1></div>${langBar()}</div></div></header>`+col(`<main class="page">${b}</main>`);
}

 'rd-open'(el){const d=rdState(),m=getM(el.dataset.id);d.open=el.dataset.id;d.kg=m?m.wl:0;d.flag=false;render();scrollTo(0,0)},
 'rd-back'(){rdState().open=null;render()},
 'rd-flag'(){const d=rdState();d.flag=!d.flag;render()},
 'rd-reason'(el){rdState().reason=el.dataset.v;render()},
 'rd-ok'(){const d=rdState(),m=getM(d.open);if(!m)return;const n=verifyM(m,d.kg);d.open=null;toast(n.status==='verified'?`Handover ${n.id} confirmed at ${nf(n.wv)} kg.`:`Handover ${n.id} flagged: ${n.note}.`);render();scrollTo(0,0)},
 'rd-flag-ok'(){const d=rdState(),m=getM(d.open);if(!m)return;const n=verifyM(m,d.kg,d.reason);d.open=null;toast(`Handover ${n.id} flagged: ${d.reason}.`);render();scrollTo(0,0)}
};
app.addEventListener('click',e=>{
 const h=e.target.closest('[data-hold]');
 if(h){const fn=h.dataset.for==='rd'?rdAdj:logAdj;if(h.dataset.did){delete h.dataset.did;return}fn(+h.dataset.hold);return}
 const el=e.target.closest('[data-act]');if(!el)return;
 const f=ACT[el.dataset.act];if(f)f(el,e)});
let holdT=null,holdI=null;
const stopHold=()=>{clearTimeout(holdT);clearInterval(holdI);holdT=holdI=null};
app.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-hold]');if(!b)return;const dv=+b.dataset.hold,fn=b.dataset.for==='rd'?rdAdj:logAdj;fn(dv);b.dataset.did='1';holdT=setTimeout(()=>{holdI=setInterval(()=>fn(dv),110)},450)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>app.addEventListener(ev,stopHold,true));document.addEventListener('pointerup',stopHold);
app.addEventListener('change',e=>{
 const el=e.target.closest('select[data-act]');
 if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e);
});
app.addEventListener('input',e=>{
 const el=e.target,p=el.dataset&&el.dataset.bind;if(!p)return;
 let v=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.type==='number'?(el.value===''?NaN:+el.value):el.value;
 if(el.type==='number'&&isNaN(v))return;
 setPath(p,v);
 if(el.dataset.out){const o=$(el.dataset.out);if(o)o.textContent=el.value}
 if(p.startsWith('ui.hf')){const b=$('#hbox');if(b)b.innerHTML=histInner()}
 else if(p.startsWith('ui.tf')){tf().n=12;tblRefresh()}
 else if(p.startsWith('ui.rep')){const b=$('#repprev');if(b)b.textContent=repPreview()}
 else if(p==='ui.rd.q'){const b=$('#rdlist');if(b)b.innerHTML=rdList()}
 else if(p==='ui.rd.rid'){rdState().q='';render()}
 else if(p.startsWith('profiles.')){persist();bump()}});
app.addEventListener('change',async e=>{
 const el=e.target;if(!el.matches||!el.matches('input[data-photo]'))return;
 const f=el.files&&el.files[0];if(!f)return;
 try{const url=await readImg(f);const path=el.dataset.photo;setPath(path+'.photo',url);setPath(path+'.sample',false);if(path==='ui.log')S.ui.log.step=2;render()}
 catch(x){toast('That photo could not be read. Try another one.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop()});

/* ================= boot ================= */
function readHash(){const m=(location.hash||'').match(/^#m-(AKR-[A-Za-z0-9-]+)$/);S.pub=m?m[1]:null}
window.addEventListener('hashchange',()=>{readHash();render()});
window.addEventListener('online',()=>{trySync();render()});
window.addEventListener('offline',()=>{S.ui.wasOffline=true;render()});
restore();cacheLoad();SAMPLE=buildSample();
document.documentElement.lang=S.lang;
S.view=(S.role&&S.profiles[S.role])?'app':'select';
readHash();render();initDb();
setTimeout(()=>{checkNotifs()},600);

</script>
</body>
</html>
